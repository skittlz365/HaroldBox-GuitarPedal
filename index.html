<!DOCTYPE html>
<html>
<head>
  <title>Guitar Pedal Control</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 40px; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
    .connect { background: #2196F3; color: white; }
    .effect { background: #333; color: white; border: 2px solid #555; }
    .active { background: #4CAF50; border-color: #81C784; }
  </style>
</head>
<body>

  <h1>🎸 &#x16BC;arald&#x16D2;ox</h1>
  <button class="connect" onclick="connectBLE()">🔗 Connect to Pedal</button>
  <p id="status">Status: Disconnected</p>

  <hr style="border-color: #333; margin: 30px 0;">

  <button class="effect" onclick="sendCommand('CLEAN')">Clean Bypass</button>
  <button class="effect" onclick="sendCommand('OVERDRIVE')">Overdrive</button>
  <button class="effect" onclick="sendCommand('DISTORTION')">Distortion</button>
  <button class="effect" onclick="sendCommand('AUTOWAH')">Auto-Wah</button>

  <div class="slider-container">
    <label>Distortion Gain: <span id="gainVal">50</span></label>
    <input type="range" id="gainSlider" min="0" max="100" value="50" oninput="updateSlider('GAIN', this.value, 'gainVal')">
  </div>

  <div class="slider-container">
    <label>Wah Sensitivity: <span id="wahVal">50</span></label>
    <input type="range" id="wahSlider" min="0" max="100" value="50" oninput="updateSlider('WAH', this.value, 'wahVal')">
  </div>
  
  <div class="slider-container">
    <label>Reverb Level: <span id="reverbVal">50</span></label>
    <input type="range" id="reverbSlider" min="0" max="100" value="50" oninput="updateSlider('REVERB', this.value, 'reverbVal')">
  </div> 

  <script>
    // These UUIDs MUST match the ones in your ESP32 code!
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    
    let pedalCharacteristic;

    async function connectBLE() {
      try {
        document.getElementById('status').innerText = "Scanning...";
        
        // 1. Ask browser to scan for devices with our Service UUID
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "HackathonPedal" }],
          optionalServices: [SERVICE_UUID]
        });

        // 2. Connect to the ESP32's GATT server
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        pedalCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById('status').innerText = "Status: Connected to " + device.name;
      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Error: " + error;
      }
    }

    async function sendCommand(cmd) {
      if (!pedalCharacteristic) {
        alert("Connect to the pedal first!");
        return;
      }
      // Convert text string to bytes and send over Bluetooth
      const encoder = new TextEncoder();
      await pedalCharacteristic.writeValue(encoder.encode(cmd));
      console.log("Sent:", cmd);
    }

    async function updateSlider(prefix, val, spanID) {
      document.getElementById(spanID).innerText = val;
      if(!pedalCharacteristic) return;
      const encoder = new TextEncoder();
      await pedalCharacteristic.writeValue(encoder.encode(prefix + ":" + val));
    }
  </script>
</body>
</html>
