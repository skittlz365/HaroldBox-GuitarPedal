<!DOCTYPE html>
<html>
<head>
  <title>Hackathon Pedal Control</title>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 40px; }
    button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; border-radius: 8px; border: none; }
    .connect { background: #2196F3; color: white; }
    .effect { background: #333; color: white; border: 2px solid #555; }
    .slider-container { margin: 20px 0; font-size: 18px; }
    input[type=range] { width: 300px; }
  </style>
</head>
<body>

  <h1>🎸 ESP32 Audio Pedal Control</h1>
  <button class="connect" onclick="connectBLE()">🔗 Connect to Pedal</button>
  <p id="status">Status: Disconnected</p>

  <hr style="border-color: #333; margin: 30px 0;">

  <!-- Presets mapping to your Faust DSP parameters -->
  <button class="effect" onclick="setPreset(0.0, 0.5, 0.0)">Clean Bypass</button>
  <button class="effect" onclick="setPreset(0.7, 0.5, 0.0)">Overdrive</button>
  <button class="effect" onclick="setPreset(1.0, 0.8, 0.0)">Distortion</button>
  <button class="effect" onclick="setPreset(0.0, 0.5, 0.8)">Auto-Wah</button>

  <div class="slider-container">
    <label>Drive / Gain: <span id="gainVal">0.5</span></label><br>
    <input type="range" id="gainSlider" min="0" max="1" step="0.01" value="0.5" oninput="updateSlider('DRIVE', this.value, 'gainVal')">
  </div>

  <div class="slider-container">
    <label>Wah Sensitivity: <span id="wahVal">0.0</span></label><br>
    <input type="range" id="wahSlider" min="0" max="1" step="0.01" value="0.0" oninput="updateSlider('WAH', this.value, 'wahVal')">
  </div>
  
  <div class="slider-container">
    <label>Tone: <span id="toneVal">0.5</span></label><br>
    <input type="range" id="toneSlider" min="0" max="1" step="0.01" value="0.5" oninput="updateSlider('TONE', this.value, 'toneVal')">
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
   
    let pedalCharacteristic;

    async function connectBLE() {
      try {
        document.getElementById('status').innerText = "Scanning...";
       
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "HackathonPedal" }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        pedalCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        document.getElementById('status').innerText = "Status: Connected to " + device.name;
      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = "Error: " + error;
      }
    }

    async function updateSlider(prefix, val, spanID) {
      document.getElementById(spanID).innerText = val;
      if (!pedalCharacteristic) return;
      const encoder = new TextEncoder();
      // Sends format like "DRIVE:0.75"
      await pedalCharacteristic.writeValue(encoder.encode(prefix + ":" + val));
    }

    async function setPreset(drive, tone, wah) {
      // Update UI Sliders
      document.getElementById('gainSlider').value = drive;
      document.getElementById('gainVal').innerText = drive;
      document.getElementById('toneSlider').value = tone;
      document.getElementById('toneVal').innerText = tone;
      document.getElementById('wahSlider').value = wah;
      document.getElementById('wahVal').innerText = wah;

      // Send to ESP32
      if (!pedalCharacteristic) return;
      const encoder = new TextEncoder();
      await pedalCharacteristic.writeValue(encoder.encode("DRIVE:" + drive));
      await new Promise(r => setTimeout(r, 50)); // small delay between writes
      await pedalCharacteristic.writeValue(encoder.encode("TONE:" + tone));
      await new Promise(r => setTimeout(r, 50));
      await pedalCharacteristic.writeValue(encoder.encode("WAH:" + wah));
    }
  </script>
</body>
</html>
